html,body{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pixelify Sans","Press Start 2P",monospace;font-size:15px}
body{min-height:100vh;display:flex;justify-content:center;padding:12px 16px}
#wrap{width:100%;max-width:1240px}
button{font-family:inherit;font-size:15px;font-weight:600;letter-spacing:.5px;color:var(--ink);background:var(--pink);border:3px solid var(--edge);padding:9px 12px;cursor:pointer;box-shadow:3px 3px 0 var(--edge)}
button:hover{filter:brightness(1.06)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
button:disabled{background:#e6e0ec;color:#7d7090;cursor:not-allowed;box-shadow:3px 3px 0 #a99cb8;border-color:#a99cb8}
#hud{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.pill{background:var(--panel);border:3px solid var(--edge);padding:8px 10px;display:flex;align-items:center;gap:8px;box-shadow:3px 3px 0 var(--edge)}
.pill img{image-rendering:pixelated}
#hearts{display:flex;gap:2px}
.spacer{flex:1}
#btnStart{background:var(--mint)}
#btnSpeed{background:var(--sky)}
#btnAuto{background:var(--lav)}
#main{display:flex;gap:12px;align-items:flex-start}
#stage{overflow:hidden;position:relative;flex:1;min-width:0;border:3px solid var(--edge);box-shadow:4px 4px 0 var(--edge);background:#bfe5ae;line-height:0}
#game{width:100%;height:auto;display:block;image-rendering:pixelated;cursor:crosshair;touch-action:none}
#side{width:270px;flex-shrink:0;display:flex;flex-direction:column;gap:12px}
.box{background:var(--panel);border:3px solid var(--edge);box-shadow:4px 4px 0 var(--edge);padding:10px}
.box h3{margin:0 0 10px;font-size:16px;letter-spacing:1px}
#shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
#hud,#side,#overlay{user-select:none;-webkit-user-select:none}
.card{position:relative;border:3px solid var(--edge);background:#fff;padding:6px 4px;text-align:center;cursor:grab;line-height:1.3;font-size:14px;font-weight:600;touch-action:none;box-shadow:3px 3px 0 var(--edge)}
.card *{pointer-events:none}
.card:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
.card img{width:48px;height:48px;image-rendering:pixelated;display:block;margin:0 auto 4px}
.card .price{display:flex;justify-content:center;align-items:center;gap:4px;color:#b07a12}
.card .key{position:absolute;top:2px;left:4px;color:var(--muted);font-size:12px}
.card .eye{position:absolute;top:2px;right:3px;background:#ffe08a;border:2px solid var(--edge);font-size:11px;padding:0 3px}
.card.gold{background:linear-gradient(#fff6c8,#ffe48a)}
.card.sel{background:#fff1a1}
.card.poor{opacity:.5}
.card.poor .price{color:#e8506e}
.card:hover{background:#fff6e0}
#info{min-height:210px;line-height:1.45;font-size:14px}
#info .title{display:flex;gap:8px;align-items:center;font-size:16px;font-weight:700;margin-bottom:6px}
#info .title img{width:48px;height:48px;image-rendering:pixelated}
.bar{display:flex;align-items:center;gap:6px;margin:2px 0}
.bar span{width:84px}
.stats{margin:6px 0 2px;font-size:13px}
.next{background:#fff;border:3px solid var(--edge);padding:6px 8px;margin-top:8px;font-size:13px}
.next b{font-size:14px}
.ups{font-size:12px;margin-top:6px;color:var(--muted)}
.bar i{display:inline-block;width:12px;height:8px;border:2px solid var(--edge);margin-right:2px;background:#fff}
.bar i.on{background:#ff8fa3}
.row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.row button{font-size:13px;padding:6px 8px}
.muted{color:var(--muted)}
.tlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tlist div{display:flex;align-items:center;gap:3px;background:#fff;border:2px solid var(--edge);padding:2px 4px}
.tlist img{width:24px;height:24px;image-rendering:pixelated;object-fit:contain}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(58,42,62,.55);line-height:1.6;padding:16px}
#overlay.hide{display:none}
.modal{background:var(--panel);border:4px solid var(--edge);box-shadow:6px 6px 0 var(--edge);padding:18px;max-width:760px;width:100%;max-height:100%;overflow:auto;text-align:center}
.modal h1{font-family:"Press Start 2P",monospace;font-size:24px;line-height:1.4;margin:4px 0 6px;color:#e8506e;text-shadow:3px 3px 0 #ffd6e4}
.modal h2{font-size:20px;margin:14px 0 8px}
.modal p{font-size:16px;margin:6px 0}
.guide{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;text-align:left;margin:8px 0 14px}
.guide div{background:#fff;border:3px solid var(--edge);padding:6px;font-size:13px;display:flex;gap:6px;align-items:center;line-height:1.3}
.guide img{width:48px;height:44px;image-rendering:pixelated;object-fit:contain;flex-shrink:0}
.guide b{font-size:14px}
/* ---- animated main menu: full-width scene, HUD hidden ---- */
body.in-menu #hud,body.in-menu #side{display:none}
body.in-menu #overlay{background:transparent}
body.in-menu .modal{background:rgba(255,250,242,.93)}
.modal.menu{max-width:440px;animation:popIn .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.logo{font-family:"Press Start 2P",monospace;font-size:clamp(18px,3.2vw,26px);line-height:1.35;margin:4px 0 8px;color:#e8506e;text-shadow:3px 3px 0 #ffd6e4,6px 6px 0 #3a2a3e22}
.logo span{display:inline-block;animation:wave 1.6s ease-in-out infinite}
.logo .vs{color:#7a5a8a;font-size:16px}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.menu-btns button{animation:slideIn .4s ease-out backwards}   /* visible even if animations never run */
.menu-btns button:hover{animation:wiggle .35s ease-in-out}
@keyframes slideIn{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg) scale(1.03)}75%{transform:rotate(2deg) scale(1.03)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.menu-stats{display:flex;justify-content:center;gap:4px 12px;font-size:13px;margin-top:6px;flex-wrap:wrap;max-width:380px;margin-left:auto;margin-right:auto}
.menu-stats b{color:#b07a12}
.credit{margin-top:10px;font-size:12px;color:var(--muted);letter-spacing:.3px}
.stars{color:#ffd34d;text-shadow:1px 1px 0 #3a2a3e;letter-spacing:2px}
.stars .off{color:#d8cfe0;text-shadow:none}
.bigstars{font-size:44px;letter-spacing:6px}
.bigstars span{display:inline-block;animation:starPop .5s cubic-bezier(.2,1.8,.4,1) both}
@keyframes starPop{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1) rotate(0)}}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;text-align:left;margin:10px 0}
.ach{background:#fff;border:3px solid var(--edge);padding:6px 8px;font-size:13px;line-height:1.3;display:flex;gap:8px;align-items:center}
.ach.locked{background:#f4f0f8;color:var(--muted)}
.ach.locked b{color:var(--muted)}
.ach .ic{font-size:22px}
#achBanner{opacity:0;position:absolute;left:50%;top:10px;transform:translate(-50%,-140%);transition:transform .35s cubic-bezier(.2,1.4,.4,1);background:#fff6c0;border:3px solid var(--edge);box-shadow:4px 4px 0 var(--edge);padding:8px 14px;line-height:1.3;font-size:14px;z-index:5;text-align:center;pointer-events:none;white-space:nowrap}
#achBanner.show{transform:translate(-50%,0);opacity:1}
#achBanner small{display:block;font-size:12px;color:var(--muted)}
.modal.wide{max-width:900px}
.ccbal{font-size:18px}.ccbal b,.ccgain{color:#b07a12}
.ccgain{font-size:18px;font-weight:700;animation:popIn .5s cubic-bezier(.2,1.6,.4,1)}
.heroes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0}
.hero{background:#fff;border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge);padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center;font-size:13px;line-height:1.3}
.hero.eq{background:#f0fbe8}
.hero img{width:96px;height:100px;image-rendering:pixelated}
.hero b{font-size:17px}
.hero .row{justify-content:center}
.treehead{display:flex;gap:12px;align-items:center;text-align:left;justify-content:center}
.treehead img{width:96px;height:100px;image-rendering:pixelated}
.tree{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0;position:relative}
.thead{font-weight:700;font-size:15px;border-bottom:3px solid var(--edge);padding-bottom:4px}
.node{background:#fff;border:3px solid var(--edge);padding:8px;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:12px;line-height:1.3;min-height:118px;justify-content:center}
.node b{font-size:14px}
.node.empty{border:none;background:none}
.node.have{background:#e8f8de}
.node.open{background:#fff6d8}
.node.locked{background:#f4f0f8}
.node.locked img{opacity:.45;filter:grayscale(.7)}
.node.locked b{color:var(--muted)}
.node.abil{box-shadow:inset 0 0 0 3px #9fe3ff}
.node img{width:48px;height:50px;image-rendering:pixelated}
.node .got{color:#3f9a5a;font-weight:700}
.node button{font-size:13px;padding:5px 10px}
.node.mini{min-height:0;flex-direction:row;justify-content:center;gap:12px;max-width:340px;margin:0 auto 12px}
.card.herocard{background:linear-gradient(#fff,#e4ecff)}
.menu-art{display:flex;justify-content:center;align-items:flex-end;gap:8px;margin:6px 0 12px}
.menu-btns{display:flex;flex-direction:column;align-items:center;gap:7px;margin:10px 0}
.menu-btns button{font-size:18px;min-width:250px;padding:7px 12px}
.menu-btns .muted{font-size:13px;margin:-4px 0 4px}
.isles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0}
.isl{background:#fff;border:3px solid var(--edge);box-shadow:3px 3px 0 var(--edge);padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.3}
.isl:hover{background:#fff6e0}
.isl.locked{cursor:not-allowed;background:#f4f0f8}
.isl.locked img{opacity:.45;filter:grayscale(.8)}
.isl.locked b{color:var(--muted)}
.isl .go{align-self:center;background:var(--mint);border:3px solid var(--edge);box-shadow:2px 2px 0 var(--edge);padding:3px 12px;font-weight:700;font-size:13px}
.isl img.map,.bigmap{width:100%;image-rendering:pixelated;border:3px solid var(--edge)}
.bigmap{max-width:480px}
.isl b{font-size:16px}
.pips{display:flex;justify-content:center;gap:4px}
.pips i{width:16px;height:12px;border:2px solid var(--edge);background:#fff}
.pips i.on{background:#7bd389}
.pips i.boss{background:#ffd6e0}
.pips i.boss.on{background:#ffd34d}
.isl .boss{display:flex;align-items:center;justify-content:center;gap:6px;text-align:left}
.matches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:12px 0}
.match{font-size:14px;padding:8px 4px;background:var(--mint);line-height:1.3}
.match span{font-size:11px}
.match .trk{font-size:10px;color:var(--muted);font-weight:600}
.match.bossm{background:#ffd6e0}
@media (max-width:640px){.matches{grid-template-columns:repeat(3,1fr)}}

body{min-height:0;height:100vh;height:100dvh;align-items:stretch;

function drawerCovers() { const s = $('side'); return (isSideDrawer() ? s.offsetWidth : s.offsetHeight) > drawerSpare + 2; }
function setDrawerFlip(flip) {   // jump to the other edge without animating across the map

  return isSideDrawer() ? c.left + p.x * k + reach > m.right - s.offsetWidth : c.top + p.y * k + reach > m.bottom - s.offsetHeight;
}
function syncDrawer() {

  if (!b.classList.contains('drawer')) return;

  const sel = S.selected || (S.selEnemy && !S.selEnemy.dead ? S.selEnemy : null), busy = !!(S.placing || S.aiming);

    VIEW_SCALE = (r.width - 11) / W; fitModal(); return;
  }
  let sc;
  if (drawer) {
    b.classList.remove('stacked');
    sc = Math.max(0.15, Math.min((r.width - pad) / W, (r.height - pad) / H));
    const spareW = r.width - (W * sc + pad), spareH = r.height - (H * sc + pad), onSide = spareW > spareH;
    const docked = !onSide && spareH >= 300;   // tall screens: the panel fits under the map, so it just stays there
    b.classList.toggle('drawer-side', onSide);
    b.classList.toggle('sheet-row', !onSide && !docked);
    b.classList.toggle('docked', docked);
    drawerSpare = onSide ? spareW : spareH;
    if (onSide) side.style.width = Math.max(drawerSpare, 230) + 'px';
    else side.style.maxHeight = (docked ? spareH - gap : Math.max(spareH, r.height * 0.5)) + 'px';
    if (docked) { side.style.top = Math.ceil(H * sc + pad + gap - 5) + 'px'; b.classList.remove('flip'); setDrawer(true); }
    else if (!b.classList.contains('drawer-open') && drawerOpen) setDrawer(true);
  } else {
    b.classList.remove('drawer-side', 'sheet-row', 'docked', 'drawer-open', 'flip');
    // A: game view beside a shop/info column.  B: game view full width, shop + info side by side underneath.
    const minSide = r.height < 900 ? Math.min(300, r.width * 0.24) : 180;   // short windows: a wider column keeps the panel readable
    const sideW = Math.max(minSide, Math.min(300, r.width - (W * (r.height - pad) / H + pad) - gap));
    const scA = Math.min((r.width - sideW - gap - pad) / W, (r.height - pad) / H);
    const panelH = Math.max(190, Math.min(300, r.height * 0.3));
    const scB = Math.min((r.width - pad) / W, (r.height - panelH - gap - pad) / H);
    const stacked = scB > scA * 1.03;
    b.classList.toggle('stacked', stacked);
    if (!stacked) side.style.width = sideW + 'px';
    sc = Math.max(0.15, stacked ? scB : scA);
  }
  stage.style.width = Math.floor(W * sc + 6) + 'px';
  stage.style.height = Math.floor(H * sc + 6) + 'px';
  VIEW_SCALE = sc;
  fitSide(); fitModal();
  if (drawer) syncDrawer();
}
let fitQueued = false;
const queueFit = () => { if (!fitQueued) { fitQueued = true; requestAnimationFrame(() => { fitQueued = false; fitLayout(); }); } };
addEventListener('resize', queueFit);
addEventListener('orientationchange', queueFit);
if (window.visualViewport) visualViewport.addEventListener('resize', queueFit);
new MutationObserver(queueFit).observe(document.body, { attributes: true, attributeFilter: ['class'] });   // menu <-> game
new MutationObserver(queueFit).observe($('overlay'), { childList: true, attributes: true, attributeFilter: ['class'] });
new MutationObserver(() => fitSide()).observe($('info'), { childList: true });
document.fonts && document.fonts.ready.then(queueFit);

updateUI(true);
showOverlay('title');
fitLayout();
requestAnimationFrame(frame);
</script>
</body>
